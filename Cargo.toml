[workspace]
resolver = "3"
members = ["crates/*", "tools/watcher"]

[workspace.package]
version = "0.4.4"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tracing = "0.1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

# wreq-util 3.0.0-rc.14 with `zstd` raised from 0.13 to 0.14 (which carries zstd-safe 8: the 0.13 line has
# open memory-safety advisories and decodes certificates from the network). Drop when upstream bumps it.
[patch.crates-io]
wreq-util = { path = "third_party/wreq-util" }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = "symbols"

# Dev builds keep line tables (backtraces, profilers) but not variable-level DWARF, and none at all for
# dependencies: debug output was most of the disk a worktree's target/ used.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
