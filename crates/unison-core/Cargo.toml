[package]
name = "unison-core"
description = "Unison client core: fidelity, transport, gateway, REST, store, cache, sessions"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
unison-etf = { path = "../unison-etf" }
unison-markdown = { path = "../unison-markdown" }

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tracing.workspace = true
base64.workspace = true
uuid.workspace = true

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "http2", "gzip", "brotli", "deflate", "zstd", "stream"] }
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Chromium-shaped TLS/HTTP2/WebSocket handshake (BoringSSL). Pinned: release candidates.
wreq = { version = "=6.0.0-rc.31", default-features = false, features = ["webpki-roots", "tokio-rt", "gzip", "brotli", "deflate", "zstd", "stream"] }
wreq-util = { version = "=3.0.0-rc.14", default-features = false, features = ["emulation"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
zstd-safe = { version = "8", features = ["std", "zdict_builder"] }
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
rand = "0.8"
ed25519-dalek = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
parking_lot = "0.12"
fastrand = "2"
libc = "0.2"
bytes = "1"
flate2 = "1"


# Voice
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
audiopus_sys = { version = "0.2", features = ["static"] }
davey = "=0.1.5"
rtrb = "0.3"
md-5 = "0.10"

# Platform audio backends: one per OS, behind `voice::audio::open`. Other OSes add theirs here.
[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-rs = { version = "0.13", default-features = false, features = ["audio_unit", "core_audio"] }
