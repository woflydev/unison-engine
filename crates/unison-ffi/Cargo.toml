[package]
name = "unison-ffi"
description = "UniFFI surface of the Unison core for native shells"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "lib"]
name = "unison_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
unison-core = { path = "../unison-core" }
unison-markdown = { path = "../unison-markdown" }
uniffi = { version = "0.29", features = ["cli"] }
parking_lot = "0.12"
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }
thiserror.workspace = true
