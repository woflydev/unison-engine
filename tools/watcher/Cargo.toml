[package]
name = "unison-watcher"
description = "Snapshots Discord's shipped client, diffs it, and signs Unison identity profiles"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "watcher"
path = "src/main.rs"

[dependencies]
unison-core = { path = "../../crates/unison-core" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "http2", "gzip", "brotli", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = { version = "0.3", default-features = false }
regex = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
